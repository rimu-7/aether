name: Build & Verify
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install pnpm
        run: npm i -g pnpm@9

      - name: install frontend dependencies
        run: pnpm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: pnpm build

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Tauri dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: check Rust compilation
        run: cd src-tauri && cargo check

  build-linux:
    runs-on: ubuntu-24.04
    needs: [typecheck-and-lint, rust-check]
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install pnpm
        run: npm i -g pnpm@9

      - name: install Tauri dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: install frontend dependencies
        run: pnpm install

      - name: Build Tauri (Linux)
        run: pnpm tauri build

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux
          path: src-tauri/target/release/bundle/*
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    needs: [typecheck-and-lint, rust-check]
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install pnpm
        run: npm i -g pnpm@9

      - name: install frontend dependencies
        run: pnpm install

      - name: Build Tauri (Windows)
        run: pnpm tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-windows
          path: src-tauri/target/release/bundle/*
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    needs: [typecheck-and-lint, rust-check]
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install pnpm
        run: npm i -g pnpm@9

      - name: install frontend dependencies
        run: pnpm install

      - name: Build Tauri (macOS)
        run: pnpm tauri build

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-macos
          path: src-tauri/target/release/bundle/*
          if-no-files-found: warn
